<section class="card auth">
  <h2>{{ isSignup() ? 'Create your account' : 'Sign in' }}</h2>

  @if (error(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="error">Enter a valid email address.</span>
      }
    </label>

    <label>
      Password
      <input
        type="password"
        formControlName="password"
        [attr.autocomplete]="isSignup() ? 'new-password' : 'current-password'"
      />
      @if (passwordTooShort()) {
        <span class="error">Use at least {{ passwordMinLength }} characters.</span>
      } @else if (form.controls.password.touched && form.controls.password.hasError('required')) {
        <span class="error">Enter your password.</span>
      } @else if (form.controls.password.hasError('maxlength')) {
        <span class="error">That password is too long.</span>
      } @else if (isSignup()) {
        <span class="hint">At least {{ passwordMinLength }} characters.</span>
      }
    </label>

    <button type="submit" class="btn-primary" [disabled]="submitting()">
      @if (submitting()) {
        {{ isSignup() ? 'Creating account…' : 'Signing in…' }}
      } @else {
        {{ isSignup() ? 'Create account' : 'Sign in' }}
      }
    </button>
  </form>

  <p class="switch">
    @if (isSignup()) {
      Already have an account? <a routerLink="/login">Sign in</a>
    } @else {
      New here? <a routerLink="/signup">Create an account</a>
    }
  </p>
</section>
