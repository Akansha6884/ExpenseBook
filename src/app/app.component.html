<header>
  <h1>Expense Book</h1>
  @if (user(); as user) {
    <nav>
      <a routerLink="/expenses" routerLinkActive="active">Expenses</a>
      <a routerLink="/summary" routerLinkActive="active">Summary</a>
      <a routerLink="/add" routerLinkActive="active">Add Expense</a>
    </nav>
    <div class="account">
      <span class="email" [title]="user.email">{{ user.email }}</span>
      <button type="button" class="sign-out" (click)="signOut()">Sign out</button>
    </div>
  }
</header>

<main class="container">
  @if (error(); as message) {
    <div class="error-banner" role="alert">
      <span>{{ message }}</span>
      <button type="button" class="dismiss" aria-label="Dismiss" (click)="dismissError()">×</button>
    </div>
  }
  <router-outlet />
</main>
